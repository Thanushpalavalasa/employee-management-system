apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: employee-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: gitops-test
      containers:
      - name: frontend
        image: thanushdev01/emp-frontend:79308aa1c1295202de535bc59807a0f45901fead
        ports:
        - containerPort: 80
