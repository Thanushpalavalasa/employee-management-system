apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: employee-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: gitops-test
      containers:
      - name: frontend
        image: thanushdev01/emp-frontend:848d71e9ff329d7188a8a0dee28db48acf14180b
        ports:
        - containerPort: 80
